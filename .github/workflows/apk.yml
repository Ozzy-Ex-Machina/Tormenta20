name: Gerar APK

on:
  push:
    branches: [ccr-ecbf7165-cgngzo, main]
    paths: ['app/**', 'capacitor.config.json', 'package.json', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Gerar a versão web (docs/)
        run: node app/build.js

      - name: Criar o projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: grimorio-tormenta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
